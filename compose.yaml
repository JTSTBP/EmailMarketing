services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'mongosh --quiet --eval ''try { rs.status().ok } catch (e) { rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]}) }''',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    environment: &app-env
      APP_MODE: mock
      ENABLE_LIVE_SENDING: "false"
      APP_ORIGIN: http://localhost:4100
      MONGODB_URI: mongodb://mongo:27017/jt_outreach?replicaSet=rs0
      HOST: 0.0.0.0
    ports: ["127.0.0.1:4100:4100"]
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "--import", "tsx", "src/worker-main.ts"]
    environment: *app-env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mongo-data:
